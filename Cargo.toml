[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs"] }
kestrel-common = { path = "crates/kestrel-common" }
kestrel-fs = { path = "crates/kestrel-fs" }
kestrel-search = { path = "crates/kestrel-search" }
kestrel-git = { path = "crates/kestrel-git" }
kestrel-lsp = { path = "crates/kestrel-lsp" }
kestrel-markdown = { path = "crates/kestrel-markdown" }
kestrel-db = { path = "crates/kestrel-db" }
kestrel-term = { path = "crates/kestrel-term" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Dependencies are built with optimizations in dev too, so git/search/markdown
# stay fast while you develop. Our own crates still build fast (opt-level 0).
[profile.dev.package."*"]
opt-level = 2
